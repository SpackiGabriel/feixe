name: CI
on: [push, pull_request]
jobs:
  check:
    runs-on: ubuntu-24.04 # pinned: Playwright 1.60 has no Chromium for ubuntu-latest (26.04)
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm test
      - run: npx playwright-core install --with-deps chromium
      - run: npm run e2e
