<!DOCTYPE html>

<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Feixe</title>
<style>
  html, body { margin: 0; height: 100%; overflow: hidden; background: #000; }
  canvas { display: block; }
  #crosshair {
    position: fixed;
    top: 50%;
    left: 50%;
    width: 2px;
    height: 2px;
    margin: -3px 0 0 -3px;
    border-radius: 50%;
    background: #fff;
    opacity: 0.5;
    pointer-events: none;
  }
</style>
</head>
<body>
<div id="crosshair"></div>
<script type="importmap">
