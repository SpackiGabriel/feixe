<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none" stroke="#d9d4c7" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round">
  <!-- Conduto de sinal saindo por baixo -->
  <line x1="32" y1="48" x2="32" y2="57" />
  <line x1="24" y1="57" x2="40" y2="57" stroke-opacity="0.45" />
  <!-- Moldura externa (carcaça de parede) -->
  <rect x="12" y="8" width="40" height="40" rx="3" />
  <!-- Painel plano interno -->
  <rect x="17" y="13" width="30" height="30" rx="2" />
  <!-- Anel de carga e símbolo circular (detalhe em #fff1d6) -->
  <circle cx="32" cy="28" r="11" stroke="#fff1d6" stroke-width="1.5" stroke-opacity="0.45" stroke-dasharray="4 3" />
  <circle cx="32" cy="28" r="6.5" stroke="#fff1d6" stroke-width="2" />
  <circle cx="32" cy="28" r="2.2" fill="#fff1d6" stroke="none" />
</svg>
