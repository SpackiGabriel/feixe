  <line x1="24" y1="34" x2="28" y2="30" stroke-opacity="0.4" />
  <!-- Feixe atravessando e sendo filtrado (detalhe em #fff1d6) -->
  <line x1="6" y1="23" x2="20" y2="23" stroke="#fff1d6" stroke-width="1.5" stroke-opacity="0.55" />
  <line x1="6" y1="26" x2="20" y2="26" stroke="#fff1d6" stroke-width="2" />
  <line x1="6" y1="29" x2="20" y2="29" stroke="#fff1d6" stroke-width="1.5" stroke-opacity="0.55" />
  <line x1="20" y1="26" x2="44" y2="26" stroke="#fff1d6" stroke-width="1.75" stroke-dasharray="2.5 2.5" />
  <line x1="44" y1="26" x2="58" y2="26" stroke="#fff1d6" stroke-width="2.25" />
  <circle cx="44" cy="26" r="2" fill="#fff1d6" stroke="none" />
</svg>
