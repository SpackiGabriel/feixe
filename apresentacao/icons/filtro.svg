<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none" stroke="#d9d4c7" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round">
  <!-- Trilho e suporte -->
  <line x1="12" y1="56" x2="52" y2="56" stroke-opacity="0.4" />
  <rect x="24" y="51" width="16" height="4" rx="1.5" />
  <line x1="32" y1="42" x2="32" y2="51" />
  <!-- Moldura estrutural com barras superior e inferior -->
  <rect x="18" y="10" width="28" height="4" rx="1.5" />
  <rect x="18" y="38" width="28" height="4" rx="1.5" />
  <!-- Placa translúcida na moldura -->
  <rect x="20" y="14" width="24" height="24" fill="#fff1d6" fill-opacity="0.08" />
  <line x1="24" y1="18" x2="30" y2="24" stroke-opacity="0.4" />
